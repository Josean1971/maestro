<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#00cfff" />
    <meta name="description" content="MAESTRO — Asistente técnico universal con IA" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Firefox and some launchers ignore the manifest and pick an icon from
         these tags instead, so every common size is declared explicitly. -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48"   href="/icon-48.png" />
    <link rel="icon" type="image/png" sizes="72x72"   href="/icon-72.png" />
    <link rel="icon" type="image/png" sizes="96x96"   href="/icon-96.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icon-128.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/icon-144.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon-precomposed" href="/icon-180.png" />
    <meta name="msapplication-TileImage" content="/icon-144.png" />
    <meta name="msapplication-TileColor" content="#020a12" />
    <title>MAESTRO</title>
    <style>
      *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
      html, body, #root {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        overflow-x: hidden;
        background: #000;
      }
      body {
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
    <script>
      // Registers the offline cache. Failures are non-fatal: the app simply
      // behaves as before, online-only.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
